<section class="login" aria-labelledby="login-title">
  <div class="login__panel">
    <p class="eyebrow">CRM workspace</p>
    <h1 id="login-title">Вход в менеджер контактов</h1>
    <p class="lead">Демо-пользователь уже подставлен. Пароль должен быть не короче 6 символов.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login__form">
      <label>
        Email
        <tui-textfield>
          <input tuiTextfield type="email" formControlName="email" autocomplete="email">
        </tui-textfield>
      </label>

      <label>
        Пароль
        <tui-textfield>
          <input tuiTextfield type="password" formControlName="password" autocomplete="current-password">
        </tui-textfield>
      </label>

      @if (error) {
        <tui-error [error]="error" />
      }

      <button tuiButton type="submit" size="l" aria-label="Войти" [disabled]="loading">
        <tui-loader [showLoader]="loading">Войти</tui-loader>
      </button>
    </form>
  </div>
</section>
