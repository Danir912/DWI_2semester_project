<tui-root>
  <div class="shell">
    <header class="topbar">
      <a class="brand" routerLink="/" aria-label="Contact CRM home">
        <span class="brand__mark" aria-hidden="true">C</span>
        <span>
          <strong>Contact CRM</strong>
          <small>{{ 'appSubtitle' | i18n }}</small>
        </span>
      </a>

      @if (auth.user$ | async) {
        <nav class="topbar__nav" aria-label="Основная навигация">
          <a routerLink="/contacts">{{ 'contacts' | i18n }}</a>
          <button type="button" class="ghost ghost_square" (click)="preferences.toggleLanguage()">
            {{ 'language' | i18n }}
          </button>
          <button type="button" class="ghost" (click)="preferences.toggleTheme()">
            {{ (preferences.theme() === 'light' ? 'themeDark' : 'themeLight') | i18n }}
          </button>
          <button type="button" class="ghost" (click)="auth.logout()">
            {{ 'logout' | i18n }}
          </button>
        </nav>
      }
    </header>

    <main>
      <router-outlet />
    </main>
  </div>
</tui-root>
