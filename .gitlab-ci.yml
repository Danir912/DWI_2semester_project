image: node:22

stages:
  - lint
  - test
  - build
  - deploy

cache:
  paths:
    - node_modules/

before_script:
  - npm ci

lint:
  stage: lint
  script:
    - npm run lint
    - npm run stylelint

unit:
  stage: test
  script:
    - npm test

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/contact-crm

pages:
  stage: deploy
  script:
    - mkdir public
    - cp -r dist/contact-crm/browser/* public/
  artifacts:
    paths:
      - public
  only:
    - main
